# Ruff Configuration
target-version = "py311"
line-length = 110

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in argument defaults (Pydantic / Streamlit patterns)
    "SIM108", # Use ternary operator instead of if-else
]

[lint.per-file-ignores]
"tests/*" = ["E402"]  # Module level import not at top of file (needed for dummy env vars setup before imports)

[format]
quote-style = "double"
indent-style = "space"
