name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Static Linting & Style Gate (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ruff Lint & Format Checks
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Run Ruff Format Verification
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m py_compile app.py config.py notion_service.py Models.py scoring_engine.py

      - name: Run Test Suite
        env:
          NOTION_API_KEY: "ci_dummy_key"
          NOTION_TASKS_DB_ID: "ci_dummy_tasks_db"
          NOTION_ASSETS_DB_ID: "ci_dummy_assets_db"
        run: |
          python -m unittest discover tests -v

  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
